<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found - Marlow Rischmüller</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<style>
  /* Self-hosted fonts - IBM Plex (SIL Open Font License). No external requests. */
  @font-face{font-family:"IBM Plex Sans";src:url("fonts/IBMPlexSans-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:"IBM Plex Sans";src:url("fonts/IBMPlexSans-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap;}
  @font-face{font-family:"IBM Plex Serif";src:url("fonts/IBMPlexSerif-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap;}
  @font-face{font-family:"IBM Plex Mono";src:url("fonts/IBMPlexMono-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:"IBM Plex Mono";src:url("fonts/IBMPlexMono-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap;}
  :root{
    --paper:#F5F6F7;--ink:#16181D;--ink-soft:#565B66;--ink-faint:#878C97;
    --accent:#2A41B8;
    --serif:"IBM Plex Serif",Georgia,serif;
    --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:1.5rem;text-align:center;
  }
  .wrap{max-width:30rem;}
  .code{
    font-family:var(--mono);font-size:0.78rem;font-weight:500;
    letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);
    margin-bottom:1.4rem;
  }
  h1{
    font-family:var(--serif);font-weight:500;font-size:clamp(2.4rem,7vw,3.4rem);
    line-height:1.05;letter-spacing:-0.015em;margin-bottom:1rem;
  }
  p{color:var(--ink-soft);font-size:1.02rem;margin-bottom:2rem;}
  .btn{
    font-family:var(--mono);font-size:0.82rem;display:inline-block;
    padding:0.62rem 1.1rem;border:1px solid var(--accent);border-radius:3px;
    background:var(--accent);color:#fff;
    transition:background .15s,border-color .15s;
  }
  .btn:hover{background:#1f3290;border-color:#1f3290;}
  a{text-decoration:none;}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px;}
</style>
</head>
<body>
  <main class="wrap">
    <div class="code">Error 404</div>
    <h1>This page doesn't exist</h1>
    <p>The page you were looking for may have moved or never existed. Let's get you back on track.</p>
    <a class="btn" href="/">Back to home</a>
  </main>
</body>
</html>
