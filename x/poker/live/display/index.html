<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>Poker Live · Display</title><link rel="stylesheet" href="../live.css"></head><body class="display-body"><main class="display-shell"><section id="display-join" class="display-join surface"><p class="eyebrow">POKER LIVE</p><h1>Live-Display öffnen</h1><p class="helper-copy">Gib den sechsstelligen Display-Code vom Controller ein. Das Display ist nur lesend.</p><label class="field"><span>Display-Code</span><input id="display-code" class="display-code-input" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="7KPX4D"></label><button id="display-connect" class="primary-live" type="button">Display verbinden</button><p class="helper-copy" id="display-error"></p></section><section id="display-view" class="display-layout" hidden><div class="display-main"><header class="display-topline"><div><span class="display-kicker">AKTUELLE BLINDS</span><strong id="blinds">–</strong></div><div class="display-round"><strong id="round-label"></strong><span id="player-count"></span></div></header><div id="status-banner"></div><div class="poker-table display-table" id="table"><div class="table-center" id="table-center"></div></div><div class="broadcast-board" id="broadcast-board" hidden><div class="broadcast-table" id="broadcast-table"><div class="broadcast-center"><span>BLINDS</span><strong id="broadcast-blinds">–</strong></div></div><div class="broadcast-side"><div><span>RUNDE</span><strong id="broadcast-round">–</strong></div><div><span>NÄCHSTE BLINDS</span><strong id="broadcast-next">–</strong></div><div class="broadcast-dynamic" id="broadcast-dynamic"><span id="broadcast-status-label">HAND</span><strong id="broadcast-status-value">–</strong><small id="broadcast-status-note"></small></div></div></div><div class="minimal-board" id="minimal-board" hidden><div class="minimal-roles" id="minimal-roles"></div><div class="minimal-players" id="minimal-players"></div></div><footer class="display-footer"><span>NÄCHSTE BLINDS</span><strong id="next-blinds">–</strong></footer></div><aside class="display-assist" id="overlay" hidden></aside></section></main><script type="module" src="display-app.js"></script></body></html>
