<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="/x/admin/shared/admin.css"><title>Daily Content Library · Secret Layer</title><script type="module" src="/x/admin/daily/content/app.js"></script></head><body><main class="admin-shell admin-page"><a class="back-link" href="/x/admin/">← Control Center</a><header class="page-header"><div class="page-heading"><p class="eyebrow">Secret Layer / Daily</p><h1>Daily Content Library</h1><p class="lede">Search, edit and archive individual entries. Rotation counters stay system-managed.</p></div></header><nav class="module-nav" aria-label="Daily Admin"><a href="/x/admin/daily/" >Overview</a><a href="/x/admin/daily/content/" aria-current="page" selected>Content</a><a href="/x/admin/daily/history/" >History</a><a href="/x/admin/daily/import/" >Import</a></nav><label class="admin-tabs-mobile"><span class="eyebrow">Section</span><select data-section-nav><option value="/x/admin/daily/" >Overview</option><option value="/x/admin/daily/content/" aria-current="page" selected>Content</option><option value="/x/admin/daily/history/" >History</option><option value="/x/admin/daily/import/" >Import</option></select></label><section class="section"><div class="section-heading"><h2>Content</h2><button class="button button-primary button-small" data-new>New entry</button></div><div class="toolbar"><input type="search" data-search placeholder="Search display label…" aria-label="Search"><select data-category><option value="">All categories</option></select><select data-status><option value="">Active + archived</option><option value="active">Active</option><option value="archived">Archived</option></select><button class="button button-secondary button-small" data-refresh>Refresh</button></div><div class="workspace-card"><div class="record-list" da
