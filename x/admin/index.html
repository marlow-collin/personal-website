<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="theme-color" content="#0b0d10">
  <title>Secret Layer · Control Center</title>
  <link rel="stylesheet" href="/x/admin/shared/admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="control-header">
      <div>
        <p class="eyebrow">Secret Layer</p>
        <h1>Control Center</h1>
        <p class="lede">Status, maintenance and access to private site tools.</p>
      </div>
      <button class="icon-action" id="refreshButton" type="button" aria-label="Refresh dashboard" title="Refresh dashboard">↻</button>
    </header>

    <section class="section attention-section" aria-labelledby="attentionTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Priority</p>
          <h2 id="attentionTitle">Needs Attention</h2>
        </div>
      </div>
      <div id="attentionList" class="attention-list" aria-live="polite">
        <div class="skeleton-line">Checking system health…</div>
      </div>
    </section>

    <section class="section" aria-labelledby="sitesTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Modules</p>
          <h2 id="sitesTitle">Secret Sites</h2>
        </div>
      </div>
      <div id="moduleGrid" class="module-grid" aria-live="polite">
        <article class="module-card skeleton-card"></article>
        <article class="module-card skeleton-card"></article>
      </div>
    </section>

    <section class="section system-section" aria-labelledby="systemTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Runtime</p>
          <h2 id="systemTitle">System</h2>
        </div>
      </div>
      <div id="systemGrid" class="system-grid" aria-live="polite">
        <div class="skeleton-line">Loading system state…</div>
      </div>
    </section>

    <p class="dashboard-meta" id="dashboardMeta"></p>
  </main>

  <script type="module" src="/x/admin/app.js"></script>
</body>
</html>
