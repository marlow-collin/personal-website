<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#111318">
  <title>Date Invitations · Admin</title>
  <link rel="stylesheet" href="/x/admin/admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Private Admin</p>
        <h1>Date Invitations</h1>
      </div>
      <button class="primary" id="newInviteButton">+ Neue Einladung</button>
    </header>

    <section class="panel create-panel" id="createPanel" hidden>
      <div class="panel-head">
        <div>
          <p class="eyebrow">Erstellen</p>
          <h2>Neue Einladung</h2>
        </div>
        <button class="icon-button" id="closeCreate" aria-label="Schließen">×</button>
      </div>

      <form id="createForm">
        <label>
          <span>Vorname</span>
          <input name="first_name" maxlength="60" required autocomplete="off" placeholder="Sophie">
        </label>

        <label>
          <span>Interne Notiz</span>
          <input name="internal_label" maxlength="120" autocomplete="off" placeholder="z. B. Hinge">
          <small>Nur im Adminbereich sichtbar.</small>
        </label>

        <label>
          <span>Persönlicher Satz <em>optional</em></span>
          <textarea name="personal_message" maxlength="240" rows="3" placeholder="Ich wollte dich etwas fragen."></textarea>
          <small>Wenn leer: „Ich wollte dich etwas fragen.“</small>
        </label>

        <label>
          <span>Abschlussnachricht <em>optional</em></span>
          <textarea name="final_message" maxlength="240" rows="3" placeholder="Klingt nach einem ziemlich guten Plan ✨"></textarea>
          <small>Wird auf der letzten Seite angezeigt.</small>
        </label>

        <fieldset>
          <legend>Design</legend>
          <div class="theme-grid">
            <label class="theme-card">
              <input type="radio" name="theme" value="soft-playful" checked>
              <div class="theme-preview soft-preview">
                <strong>Hey 👋</strong>
                <span>Soft + Playful</span>
              </div>
            </label>
            <label class="theme-card">
              <input type="radio" name="theme" value="dark-elegant">
              <div class="theme-preview dark-preview">
                <strong>✦ Hey.</strong>
                <span>Dark Elegant</span>
              </div>
            </label>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="button" class="secondary" id="cancelCreate">Abbrechen</button>
          <button type="submit" class="primary">Einladung erstellen</button>
        </div>
      </form>
    </section>

    <section class="stats" id="stats"></section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">Übersicht</p>
          <h2>Einladungen</h2>
        </div>
        <button class="secondary small" id="refreshButton">Aktualisieren</button>
      </div>
      <div id="inviteList" class="invite-list">
        <p class="muted">Lade Einladungen …</p>
      </div>
    </section>
  </main>

  <dialog id="inviteDialog">
    <div class="dialog-head">
      <div>
        <p class="eyebrow">Einladung</p>
        <h2 id="dialogTitle">Details</h2>
      </div>
      <button class="icon-button" id="closeDialog" aria-label="Schließen">×</button>
    </div>

    <div class="detail-grid" id="detailGrid"></div>

    <div class="link-box">
      <span>Persönlicher Link</span>
      <code id="inviteUrl"></code>
      <div class="button-row">
        <button class="primary small" id="copyLink">Link kopieren</button>
        <button class="secondary small" id="previewLink">Vorschau</button>
      </div>
    </div>

    <div class="danger-section">
      <h3>Verwaltung</h3>
      <p class="muted">Fortschritt zurücksetzen behält den Link. Löschen entfernt die Einladung vollständig.</p>
      <div class="button-row">
        <button class="secondary small" id="resetProgress">Fortschritt zurücksetzen</button>
        <button class="danger small" id="deleteInvite">Einladung löschen</button>
      </div>
    </div>

    <div class="qr-section">
      <div class="qr-head">
        <h3>QR-Code</h3>
        <button class="secondary small" id="toggleQr">Anzeigen</button>
      </div>
      <div class="qr-wrap" id="qrWrap" hidden>
        <div id="qrPreview"></div>
        <div class="button-row">
          <button class="secondary small" id="downloadSvg">SVG herunterladen</button>
          <button class="secondary small" id="downloadPng">PNG herunterladen</button>
        </div>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <script src="/x/admin/qrcode-local.js"></script>
  <script src="/x/admin/admin.js"></script>
</body>
</html>
