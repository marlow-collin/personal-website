<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Daily Content</title>
  <link rel="stylesheet" href="/x/daily/assets/css/daily-base.css">
  <link rel="stylesheet" href="/x/daily/assets/css/category.css">
  <script type="module" src="/x/daily/assets/js/category.js"></script>
</head>
<body data-daily-category="today-i-learned">
  <main class="daily-category" data-daily-root>
    <nav class="daily-category__nav"><a href="/x/daily/">← Daily Content</a></nav>

    <header class="daily-category__header">
      <div class="daily-category__icon" aria-hidden="true" data-category-icon></div>
      <div>
        <p class="daily-eyebrow" data-group-label></p>
        <h1 data-category-label>Daily Content</h1>
        <p class="daily-category__date" data-date aria-live="polite"></p>
      </div>
    </header>

    <section class="daily-reveal" data-state="transition" aria-live="polite">
      <div class="daily-entry-transition" data-entry-transition aria-hidden="true">
        <span class="daily-entry-transition__orb"></span>
        <span class="daily-entry-transition__ring"></span>
        <span class="daily-entry-transition__mark" data-transition-mark></span>
        <span class="daily-entry-transition__line daily-entry-transition__line--one"></span>
        <span class="daily-entry-transition__line daily-entry-transition__line--two"></span>
      </div>

      <article class="daily-content" data-content hidden></article>

      <div class="daily-message" data-empty hidden>
        <h2 data-empty-title>Noch nichts im Pool</h2>
        <p>Für diese Kategorie wurden noch keine Inhalte importiert.</p>
      </div>

      <div class="daily-message daily-message--error" data-error hidden>
        <h2>Das hat gerade nicht geklappt.</h2>
        <p>Der heutige Inhalt konnte nicht geladen werden.</p>
        <button type="button" data-retry>Erneut versuchen</button>
      </div>
    </section>
  </main>
</body>
</html>
