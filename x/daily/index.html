<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Daily Content</title>
  <link rel="stylesheet" href="/x/daily/assets/css/daily-base.css">
  <link rel="stylesheet" href="/x/daily/assets/css/overview.css">
  <script type="module" src="/x/daily/assets/js/overview.js"></script>
</head>
<body>
  <main class="daily-overview">
    <header class="daily-overview__intro">
      <p class="daily-eyebrow">Daily Content</p>
      <h1>Ein kleiner Fund für heute.</h1>
      <p>Sechzehn kleine Daily-Kategorien. Inhalt wird erst verbraucht, wenn du die jeweilige Kategorie wirklich öffnest.</p>
    </header>

    <nav class="daily-shortcuts" aria-label="Zu einer Kategoriegruppe springen" data-shortcuts></nav>
    <div class="daily-groups" data-groups></div>

    <noscript>
      <p class="daily-noscript">Für Daily Content muss JavaScript aktiviert sein.</p>
    </noscript>
  </main>

  <div class="daily-overview-transition" aria-hidden="true" data-overview-transition>
    <span class="daily-overview-transition__orb"></span>
    <span class="daily-overview-transition__ring"></span>
    <span class="daily-overview-transition__mark" data-transition-mark></span>
    <span class="daily-overview-transition__line daily-overview-transition__line--one"></span>
    <span class="daily-overview-transition__line daily-overview-transition__line--two"></span>
  </div>
</body>
</html>
