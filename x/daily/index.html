<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Daily Content</title>
  <link rel="stylesheet" href="/x/daily/assets/css/daily-base.css">
  <link rel="stylesheet" href="/x/daily/assets/css/overview.css">
</head>
<body>
  <main class="daily-overview">
    <header class="daily-overview__intro">
      <p class="daily-eyebrow">Daily Content</p>
      <h1>Ein kleiner Fund für heute.</h1>
      <p>Zum Start testen wir nur eine Kategorie. Weitere kommen hinzu, sobald die Daily-Logik vollständig geprüft ist.</p>
    </header>

    <section aria-labelledby="knowledge-title">
      <h2 id="knowledge-title">Wissen &amp; Entdecken</h2>
      <a class="daily-category-card" href="/x/daily/fact/">
        <span class="daily-category-card__icon" aria-hidden="true">
          <img src="/x/daily/icons/fact.svg" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
          <span hidden>ℹ️</span>
        </span>
        <span class="daily-category-card__copy">
          <strong>Fakt des Tages</strong>
          <span>Ein überprüfbarer Fakt – kurz erklärt und mit Quellen belegt.</span>
        </span>
        <span class="daily-category-card__arrow" aria-hidden="true">→</span>
      </a>
    </section>
  </main>
</body>
</html>
