<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#10271d">
  <title>Event</title>
  <link rel="stylesheet" href="/x/_event-template/styles.css">
</head>
<body>
  <main class="event-page" id="eventPage" data-theme="minimal" aria-busy="true">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <article class="invite" hidden id="invite">
      <header class="invite-header">
        <div class="event-icon" id="eventIcon" hidden></div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title"></h1>
        <p class="subtitle" id="subtitle" hidden></p>
      </header>

      <section class="date-panel" aria-label="Event date and time">
        <div class="date-block"><span>Date</span><strong id="dateLabel"></strong></div>
        <div class="date-block"><span>Time</span><strong id="timeLabel"></strong></div>
      </section>

      <section class="countdown-card" aria-live="polite">
        <span class="status-pill" id="statusPill">Upcoming</span>
        <p class="countdown-kicker" id="countdownKicker">Starts in</p>
        <div class="countdown-primary" id="countdownPrimary">—</div>
        <p class="countdown-secondary" id="countdownSecondary"></p>
      </section>

      <p class="description" id="description" hidden></p>

      <section class="detail-grid" id="details" hidden></section>

      <a class="location-card" id="location" hidden>
        <span>Location</span>
        <strong id="locationLabel"></strong>
        <b aria-hidden="true">↗</b>
      </a>

      <section class="actions" id="actions">
        <a class="primary-action" id="primaryAction" hidden></a>
        <div class="secondary-actions" id="secondaryActions"></div>
        <a class="calendar-action" id="calendarAction">Add to calendar <span>.ics</span></a>
      </section>

      <p class="closing" id="closing" hidden></p>
    </article>

    <section class="error-card" id="errorCard" hidden>
      <p class="eyebrow">Secret Event</p>
      <h1>Not available.</h1>
      <p>This event could not be loaded.</p>
    </section>
  </main>

  <script type="module" src="/x/_event-template/app.js"></script>
</body>
</html>
